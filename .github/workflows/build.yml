name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mii-renderer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ariankordi/FFL-Testing
          ref: renderer-server-prototype
          path: ffl-testing
          submodules: recursive
      - name: Install native renderer dependencies
        shell: pwsh
        run: vcpkg install --triplet x64-windows-static
        working-directory: ffl-testing
      - name: Configure native renderer
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DNO_GLTF=ON `
            -DRIO_USE_HEADLESS_GLFW=ON 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: ffl-testing
      - name: Upload native configure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sesame-mii-renderer-diagnostics
          path: |
            ffl-testing/configure.log
            ffl-testing/build/CMakeFiles/CMakeError.log
            ffl-testing/build/CMakeFiles/CMakeOutput.log
          if-no-files-found: warn
      - name: Build native renderer
        shell: pwsh
        run: cmake --build build --config Release --target ffl_testing_2 --parallel
        working-directory: ffl-testing
      - name: Stage native renderer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force renderer | Out-Null
          $binary = Join-Path $PWD 'ffl_testing_2.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw "FFL renderer binary was not produced: $binary" }
          Copy-Item -LiteralPath $binary -Destination renderer
          Copy-Item -LiteralPath LICENSE -Destination renderer\FFL-Testing-LICENSE.txt
        working-directory: ffl-testing
      - uses: actions/upload-artifact@v4
        with:
          name: sesame-mii-renderer
          path: ffl-testing/renderer

  windows:
    needs: mii-renderer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore SESAME.sln
      - run: dotnet publish src/Sesame.Windows/Sesame.Windows.csproj -c Release -o artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: sesame-mii-renderer
          path: artifacts/windows/Renderer
      - uses: actions/upload-artifact@v4
        with:
          name: sesame-windows
          path: artifacts/windows

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libice-dev libsm-dev libfontconfig1
      - run: dotnet publish src/Sesame.Deck/Sesame.Deck.csproj -c Release -r linux-x64 --self-contained true -o artifacts/linux-x64
      - run: test -s artifacts/linux-x64/SESAME
      - run: chmod +x artifacts/linux-x64/SESAME
      - uses: actions/upload-artifact@v4
        with:
          name: sesame-linux-x64
          path: artifacts/linux-x64

  release:
    needs: [windows, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sesame-windows
          path: pack/windows
      - uses: actions/download-artifact@v4
        with:
          name: sesame-linux-x64
          path: pack/linux-x64
      - name: Pack versioned assets
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'<Version>([^<]+)', open('Directory.Build.props', encoding='utf-8').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 .github/scripts/changelog_section.py "$VERSION" > release-notes.md
          python3 -c "import shutil; shutil.make_archive('sesame-windows', 'zip', 'pack/windows')"
          tar -czf sesame-linux-x64.tar.gz -C pack/linux-x64 .
          test -s sesame-windows.zip
          test -s sesame-linux-x64.tar.gz
          tar -tzf sesame-linux-x64.tar.gz | grep -E '(^|/)SESAME$'
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SESAME ${{ env.VERSION }}
          body_path: release-notes.md
          make_latest: true
          files: |
            sesame-windows.zip
            sesame-linux-x64.tar.gz
      - name: Refresh linux tag (installer fallback)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux
          name: SESAME Linux
          make_latest: false
          files: sesame-linux-x64.tar.gz
